# Nim configuration for Kairos

# SSL for AsyncHttpClient (calls to twitch.tv)
-d:ssl

# Garbage collector
--mm:orc

# Root path: resolves `commands/...` (plugins) and `generated/...`
--path:"." --path:src

# Development defaults
# --verbosity:1

# Release build (use: nim c -d:release src/kairos.nim)
# --opt:speed
# --strip
